name: Release

# Pushing a version tag (0.1.0, with no v, as SwiftPM expects) checks the tagged commit as CI does,
# then creates the GitHub release. SwiftPM serves the tag itself, so nothing is uploaded.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  tag:
    name: Check the tag and the vendored protos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: make verify-version RELEASE_TAG="$GITHUB_REF_NAME"

      # The release gate that CI leaves out: proto/ must be what the pinned commit exports, which needs
      # buf and the Buf Schema Registry.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          setup_only: true

      - run: make check-proto-pin

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Create the GitHub release
    needs: [tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
