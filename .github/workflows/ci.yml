name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Format, lint, codegen, test & build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Mostly for protoc, which `make protos` builds from source: minutes on a cold cache.
      - uses: actions/cache@v6
        with:
          path: |
            .build
            Tools/.build
          key: linux-${{ hashFiles('Tools/linux.Dockerfile', 'Package.resolved', 'Tools/Package.resolved') }}

      # The Swift 6.2 container of Tools/linux.Dockerfile, as `make docker-ci` runs it locally.
      - run: make docker-ci

      - name: Check for uncommitted changes
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }

  macos:
    name: Test on macOS and the iOS simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: make check-ios

  xcode-floor:
    name: Build for iOS with Xcode 16.0, the oldest supported
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: make build-ios
